; Cyber Circle robot firmware (ESP32): pio run -t upload, pio device monitor
; Settings (network, MQTT broker, pins, motor, sensors, LEDs, the cable window): include/config.h
; The head turns on a DC motor (H-bridge); a mark sensor sees every side, the
; home sensor the start position; FastLED for the bulbs, the dome and the eye;
; a relay for the smoke machine. Talks MQTT like the tiles (src/main.cpp).

[platformio]
default_envs = esp32dev             ; (pio run: the board; -e ota, -e native, pio test -e test: the others)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
build_flags = -DCORE_DEBUG_LEVEL=0

; Flashing over the network (Ethernet, ArduinoOTA - after the first flash over USB):
;   pio run -e ota -t upload --upload-port <IP>     (the IP: the control server's Verbindingen / the hello)
; the password = OTA_PASSWORD in include/config.h
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_flags = --auth=change-me

; a bare ESP32 dev board without Ethernet: wifi (WIFI_SSID / WIFI_PASSWORD in config.h)
[env:esp32dev-wifi]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DNET_WIFI

; The robot emulator on this PC (no hardware): the same firmware with a
; simulated head (emulator/: the motor turns it, the marks and the home sensor
; read its angle) and a live SVG view. pio run -e native, then
;   .pio/build/native/program --host 127.0.0.1 --port 1883 --web 8095 [--start-turns 0.4]
[env:native]
platform = native
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
lib_compat_mode = off
build_src_filter = +<*> +<../emulator/>
build_flags =
    -std=gnu++17 -Iemulator -I../common/emulator -Iinclude -DNET_WIFI
    -DMQTT_HOST=emu_host -DMQTT_PORT=emu_port -DMQTT_USER=emu_user -DMQTT_PASSWORD=emu_password
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1 -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0 -DARDUINOJSON_ENABLE_PROGMEM=0

; the motion planner's tests on this PC: pio test -e test
[env:test]
platform = native
test_build_src = no
