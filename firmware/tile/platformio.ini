; Cyber Circle Challenge tile firmware (ESP32): pio run -t upload, pio device monitor
; Settings (Ethernet, MQTT broker, pins, LED layout): include/config.h
; The tile: an ESP32 with Ethernet (LAN8720) socketed on the tile's carrier board -
; always wired, there is no wifi build.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
build_flags = -DCORE_DEBUG_LEVEL=0

; Flashing over the network (Ethernet, ArduinoOTA - after the first flash over USB):
;   pio run -e ota -t upload --upload-port <IP>     (the IP: the control server's Verbindingen / the hello)
; the password = OTA_PASSWORD in include/config.h
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_flags = --auth=change-me

; The tile emulator on this PC (no hardware, no account): the same firmware
; with stand-ins for Arduino / FastLED / the network (emulator/, ../common/emulator/), drawn in the
; terminal, keys 1-4 = the icons. pio run -e native, then
;   .pio/build/native/program --mac 02:00:00:00:00:03 --host 127.0.0.1 --port 1883
[env:native]
platform = native
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
lib_compat_mode = off
build_src_filter = +<*> +<../emulator/>
build_flags =
    -std=gnu++17 -Iemulator -I../common/emulator -Iinclude -DNET_EMULATOR
    -DMQTT_HOST=emu_host -DMQTT_PORT=emu_port -DMQTT_USER=emu_user -DMQTT_PASSWORD=emu_password
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1 -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0 -DARDUINOJSON_ENABLE_PROGMEM=0
