<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Circle - jouw scherm</title>
<style>
  /* high contrast, large, no animation; the page works without the video */
  :root { --bg: #000; --fg: #fff; --accent: #ffd60a; --dim: #c8c8c8; --bad: #ff6b6b; --good: #7dff9a; --size: 22px; }
  @media (prefers-color-scheme: light) { :root { --bg: #fff; --fg: #000; --accent: #6b3e00; --dim: #333; --bad: #b00020; --good: #075e1d; } }
  html { font-size: var(--size); }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; line-height: 1.45; }
  main { max-width: 46rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; color: var(--accent); }
  h2 { font-size: 1.15rem; margin: 1.25rem 0 .5rem; color: var(--accent); }
  p { margin: .4rem 0; }
  button { font: inherit; font-weight: 700; min-height: 3rem; padding: .5rem 1rem; border: 3px solid var(--fg);
           background: var(--bg); color: var(--fg); border-radius: .5rem; cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0; }
  #status { font-weight: 700; }
  #question { font-size: 1.25rem; font-weight: 700; }
  #answers { padding-left: 1.4rem; }
  #answers li { margin: .3rem 0; }
  .pads { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .pads button { min-height: 5rem; font-size: 1.1rem; }
  .pads button.chosen { background: var(--fg); color: var(--bg); }
  #log { list-style: none; padding: 0; color: var(--dim); }
  #log li { border-top: 1px solid var(--dim); padding: .3rem 0; }
  .urgent { color: var(--bad); }
  #video-box[hidden], .hidden { display: none; }
  video { width: 100%; background: #111; border: 2px solid var(--dim); touch-action: pinch-zoom; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #offline { color: var(--bad); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1 id="title">Cyber Circle</h1>
  <p id="status">Verbinden…</p>
  <p id="offline" hidden>Geen verbinding met het spel - het opnieuw proberen…</p>

  <!-- what the screen reader says: polite for the flow, assertive for what is urgent -->
  <div id="say" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="alert" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <section aria-labelledby="q-head">
    <h2 id="q-head">Vraag</h2>
    <p id="question">Nog geen vraag.</p>
    <ol id="answers"></ol>
    <div class="row">
      <button id="repeat" type="button">Herhaal de vraag</button>
      <button id="bigger" type="button" aria-label="Grotere tekst">A+</button>
      <button id="smaller" type="button" aria-label="Kleinere tekst">A−</button>
    </div>
  </section>

  <section id="pads-box" aria-labelledby="pads-head" hidden>
    <h2 id="pads-head">Antwoorden</h2>
    <p class="hint">Drukken hier is hetzelfde als drukken op je tegel.</p>
    <div class="pads">
      <button type="button" data-button="Square">Vierkant<br><small>links boven</small></button>
      <button type="button" data-button="Triangle">Driehoek<br><small>rechts boven</small></button>
      <button type="button" data-button="Cross">Kruis<br><small>links onder</small></button>
      <button type="button" data-button="Circle">Cirkel<br><small>rechts onder</small></button>
    </div>
  </section>

  <section id="video-section" aria-labelledby="v-head" hidden>
    <h2 id="v-head">Het scherm</h2>
    <p>Je scherm van dichtbij: met twee vingers inzoomen.</p>
    <div class="row">
      <button id="video-toggle" type="button" aria-pressed="false">Toon het scherm</button>
      <button id="video-full" type="button" hidden>Volledig scherm</button>
    </div>
    <div id="video-box" hidden>
      <video id="video" playsinline autoplay muted aria-label="Live beeld van jouw spelscherm"></video>
      <p id="video-state" aria-live="polite"></p>
    </div>
  </section>

  <section aria-labelledby="log-head">
    <h2 id="log-head">Wat er gebeurde</h2>
    <ul id="log"></ul>
  </section>
</main>
<script>
"use strict";
const token = location.pathname.split("/").filter(Boolean).pop();
const api = p => `/api/a11y/${token}${p}`;
const $ = id => document.getElementById(id);
let question = "", answers = [];

// ---------------------------------------------------------------- speaking: a queue, ~1.2 s per line
const queue = [];
function announce(text, urgent = false) {
  queue.push({ text, urgent });
  const li = document.createElement("li");
  li.textContent = text;
  if (urgent) li.className = "urgent";
  $("log").prepend(li);
  while ($("log").children.length > 12) $("log").lastChild.remove();
}
setInterval(() => {
  const m = queue.shift();
  if (!m) return;
  const region = m.urgent ? $("alert") : $("say");
  region.textContent = "";                     // (the same text twice is read twice)
  setTimeout(() => { region.textContent = m.text; }, 60);
}, 1200);

function showQuestion() {
  $("question").textContent = question || "Nog geen vraag.";
  $("answers").replaceChildren(...answers.filter(Boolean).map(a => {
    const li = document.createElement("li");
    li.textContent = a.text;
    return li;
  }));
}

// ---------------------------------------------------------------- the live text from the game
function connect() {
  const es = new EventSource(api("/events"));
  es.onopen = () => { $("offline").hidden = true; };
  es.onerror = () => { $("offline").hidden = false; };
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "status") {
      $("status").textContent = m.text;
      if (!m.replay) announce(m.text);
    } else if (m.type === "question") {
      question = m.text; answers = [];
      document.querySelectorAll(".pads button").forEach(b => b.classList.remove("chosen"));
      showQuestion();
      announce("Vraag: " + m.text, !m.replay);
    } else if (m.type === "answer") {
      answers[m.n - 1] = m;
      showQuestion();
      announce(m.text);
    } else if (m.type === "round") {
      announce(m.text);
    } else if (m.type === "say") {
      announce(m.text, m.urgent);
    }
  };
}

$("repeat").onclick = () => {
  if (!question) return announce("Er is nog geen vraag.");
  announce("Vraag: " + question);
  answers.filter(Boolean).forEach(a => announce(a.text));
};

// ---------------------------------------------------------------- text size (kept on this phone)
let size = 22;
try { size = Number(localStorage.getItem("cc-a11y-size")) || 22; } catch (e) {}
function setSize(s) {
  size = Math.max(16, Math.min(44, s));
  document.documentElement.style.setProperty("--size", size + "px");
  try { localStorage.setItem("cc-a11y-size", String(size)); } catch (e) {}
}
setSize(size);
$("bigger").onclick = () => setSize(size + 3);
$("smaller").onclick = () => setSize(size - 3);

// ---------------------------------------------------------------- answer buttons (= pressing the tile)
document.querySelectorAll(".pads button").forEach(b => b.onclick = async () => {
  const r = await fetch(api("/press"), { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ button: b.dataset.button }) });
  if (r.ok) {
    document.querySelectorAll(".pads button").forEach(x => x.classList.toggle("chosen", x === b));
  } else {
    announce("Dat ging niet: " + (r.status === 409 ? "je staat nog niet op een plaats." : "probeer opnieuw."), true);
  }
});

// ---------------------------------------------------------------- the video (WebRTC, WHEP) - only when asked
let pc = null, keepAlive = null;
async function videoOn() {
  $("video-box").hidden = false;
  $("video-full").hidden = false;
  $("video-toggle").textContent = "Verberg het scherm";
  $("video-toggle").setAttribute("aria-pressed", "true");
  $("video-state").textContent = "Het scherm wordt gestart…";
  const r = await fetch(api("/video"), { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ on: true }) });
  if (!r.ok) { $("video-state").textContent = "Het scherm is nu niet beschikbaar."; return; }
  const { whep } = await r.json();
  keepAlive = setInterval(() => fetch(api("/video"), { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ on: true }) }), 10000);
  for (let attempt = 0; attempt < 12 && keepAlive; attempt++) {   // (the game needs a moment to start it)
    try {
      pc = new RTCPeerConnection();
      pc.addTransceiver("video", { direction: "recvonly" });
      pc.ontrack = e => { $("video").srcObject = e.streams[0]; $("video-state").textContent = ""; };
      await pc.setLocalDescription(await pc.createOffer());
      await new Promise(ok => { if (pc.iceGatheringState === "complete") ok();
        pc.onicegatheringstatechange = () => pc.iceGatheringState === "complete" && ok(); setTimeout(ok, 1500); });
      const ans = await fetch(whep, { method: "POST", headers: { "Content-Type": "application/sdp" }, body: pc.localDescription.sdp });
      if (!ans.ok) throw new Error(ans.status);
      await pc.setRemoteDescription({ type: "answer", sdp: await ans.text() });
      return;
    } catch (e) {
      if (pc) pc.close();
      pc = null;
      await new Promise(ok => setTimeout(ok, 1500));
    }
  }
  if (keepAlive) $("video-state").textContent = "Het scherm kwam niet door. Probeer later opnieuw.";
}
function videoOff() {
  clearInterval(keepAlive); keepAlive = null;
  if (pc) pc.close();
  pc = null;
  $("video").srcObject = null;
  $("video-box").hidden = true;
  $("video-full").hidden = true;
  $("video-toggle").textContent = "Toon het scherm";
  $("video-toggle").setAttribute("aria-pressed", "false");
  fetch(api("/video"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ on: false }) });
}
$("video-toggle").onclick = () => (keepAlive ? videoOff() : videoOn());
$("video-full").onclick = () => $("video").requestFullscreen?.();
addEventListener("pagehide", () => { if (keepAlive) navigator.sendBeacon(api("/video"),
  new Blob([JSON.stringify({ on: false })], { type: "application/json" })); });

// ---------------------------------------------------------------- start
fetch(api("/info")).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(info => {
  $("title").textContent = info.name ? `Cyber Circle - ${info.name}` : "Cyber Circle";
  document.title = `${info.name || "Cyber Circle"} - jouw scherm`;
  $("pads-box").hidden = !info.buttons;
  $("video-section").hidden = !info.video;
  connect();
}).catch(() => { $("status").textContent = "Deze link werkt niet (meer). Vraag een nieuwe aan de gamemaster."; });
</script>
</body>
</html>
