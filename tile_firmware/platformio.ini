; Cyber Circle tile firmware (ESP32): pio run -t upload, pio device monitor
; Settings (wifi, MQTT broker, pins, LED layout): include/config.h

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
build_flags = -DCORE_DEBUG_LEVEL=0

; The emulator (Wokwi: VS Code extension or wokwi-cli, see wokwi.toml and
; diagram.json): its wifi, and the MQTT broker on this PC through Wokwi's
; private gateway (host.wokwi.internal). pio run -e wokwi, then start it.
[env:wokwi]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASSWORD=\"\"
    -DMQTT_HOST=\"host.wokwi.internal\"
    -DMQTT_PORT=1883
    -DSENSOR_PRESS=1500
    -DSENSOR_RELEASE=800
