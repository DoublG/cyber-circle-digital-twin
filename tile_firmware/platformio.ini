; Cyber Circle tile firmware (ESP32): pio run -t upload, pio device monitor
; Settings (Ethernet / wifi, MQTT broker, pins, LED layout): include/config.h
; The tile: an ESP32 with Ethernet (LAN8720) socketed on the tile's carrier board.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
build_flags = -DCORE_DEBUG_LEVEL=0

; a bare ESP32 dev board without Ethernet: wifi (WIFI_SSID / WIFI_PASSWORD in config.h)
[env:esp32dev-wifi]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DNET_WIFI

; The emulator (Wokwi: VS Code extension or wokwi-cli, see wokwi.toml and
; diagram.json): its wifi, and the MQTT broker on this PC through Wokwi's
; private gateway (host.wokwi.internal). pio run -e wokwi, then start it.
[env:wokwi]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DNET_WIFI
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASSWORD=\"\"
    -DMQTT_HOST=\"host.wokwi.internal\"
    -DMQTT_PORT=1883
    -DSENSOR_PRESS=1500
    -DSENSOR_RELEASE=800

; The tile emulator on this PC (no hardware, no account): the same firmware
; with stand-ins for Arduino / FastLED / WiFi (emulator/), drawn in the
; terminal, keys 1-4 = the icons. pio run -e native, then
;   .pio/build/native/program --mac 02:00:00:00:00:03 --host 127.0.0.1 --port 1883
[env:native]
platform = native
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
lib_compat_mode = off
build_src_filter = +<*> +<../emulator/>
build_flags =
    -std=gnu++17 -Iemulator -Iinclude -DNET_WIFI
    -DMQTT_HOST=emu_host -DMQTT_PORT=emu_port -DMQTT_USER=emu_user -DMQTT_PASSWORD=emu_password
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1 -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0 -DARDUINOJSON_ENABLE_PROGMEM=0
