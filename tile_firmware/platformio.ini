; Cyber Circle tile firmware (ESP32): pio run -t upload, pio device monitor
; Settings (wifi, MQTT broker, pins, LED layout): include/config.h

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
build_flags = -DCORE_DEBUG_LEVEL=0
