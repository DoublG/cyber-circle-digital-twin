# The broker on the gamemaster PC. Certificates: deploy/certs (make_certs.sh).
per_listener_settings false
allow_anonymous true
persistence false
log_type error
log_type warning
log_type notice
# the log on the console and on $SYS/broker/log/... (the control server's Verbindingen)
log_dest stdout
log_dest topic

# plain MQTT: the tiles (the ESP32 firmware has no TLS)
listener 1883
protocol mqtt

# MQTT over TLS
listener 8883
protocol mqtt
cafile /certs/ca.pem
certfile /certs/server.pem
keyfile /certs/server.key

# WebSocket over TLS: the game (screen PC), the control server, the gamemaster app
listener 9443
protocol websockets
cafile /certs/ca.pem
certfile /certs/server.pem
keyfile /certs/server.key
