# The Cyber Circle broker (install_server.sh: /etc/mosquitto/conf.d/cybercircle.conf).
# Comments only on their own line (mosquitto.conf has no trailing comments).
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/cybercircle.passwd

# plain MQTT: the tiles (the ESP32 firmware has no TLS)
listener @MQTT_PORT@
protocol mqtt

# WebSocket: the game, the control server, the gamemaster app
listener @MQTT_WS_PORT@
protocol websockets
