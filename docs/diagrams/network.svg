<text x="700" y="700" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f6feb" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">13 × Cat6 (one per tile, ≤ 100 m) – the tile gets its address by DHCP and announces its MAC</text>
<rect x="1030" y="530" width="330" height="130" rx="8" fill="#dafbe1" stroke="#57606a" stroke-width="1.5"/>
<text x="1042" y="552" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">Mobile station  (elsewhere in the booth)</text>
<text x="1042" y="581.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">hand-held tiles M1–M5 + Pi 4 (Mobile A + B):</text>
<text x="1042" y="597.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">a small switch there, one Cat6 to the core</text>
<text x="1042" y="613.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">switch – or the tiles on wifi</text>
<text x="1042" y="629.5" font-size="12" text-anchor="start" font-weight="400" fill="#57606a">(firmware env esp32dev-wifi)</text>
