<text x="112" y="130" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">Ethernet (Cat6)</text>
<polyline points="54,146 100,146" fill="none" stroke="#1f6feb" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="112" y="150" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">wifi</text>
<rect x="40" y="170" width="360" height="166" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="52" y="190" font-size="12.5" text-anchor="start" font-weight="700" fill="#24292f">Ports open on the server (ufw: install_server/game.sh)</text>
<text x="52" y="212" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">1883 tcp   MQTT – tiles, lighting bridge</text>
<text x="52" y="228" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">9001 tcp   MQTT over WebSocket – master, Pis, control</text>
<text x="52" y="244" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">7350 udp   ENet – the Pis follow the master</text>
<text x="52" y="260" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">7351 udp   beacon – where the master is (broadcast)</text>
<text x="52" y="276" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">8080 tcp   web interface + API (8443 with https)</text>
<text x="52" y="292" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">8554 tcp   RTSP – the master publishes video (A11Y_VIDEO)</text>
<text x="52" y="308" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">8889 tcp / 8189 udp   WebRTC – phones watch</text>
<text x="52" y="324" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">(8079 and 3306 stay on the server itself)</text>
<rect x="1030" y="90" width="330" height="87.5" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="1042" y="110" font-size="12.5" text-anchor="start" font-weight="700" fill="#24292f">Notes</text>
<text x="1042" y="132" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">No multicast / mDNS needed.</text>
<text x="1042" y="148.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">No TURN server: phones and server on</text>
<text x="1042" y="165.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">the same LAN (WebRTC goes direct).</text>
