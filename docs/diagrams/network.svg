<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="38" font-size="24" text-anchor="start" font-weight="700" fill="#24292f">Network – one wired LAN, one wifi</text>
<text x="24" y="62" font-size="13" text-anchor="start" font-weight="400" fill="#57606a">All on one subnet with DHCP; only the server has a fixed address (tiles, Pis and app find the broker there)</text>
<rect x="560" y="90" width="280" height="70" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
<text x="572" y="112" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">Router / firewall + DHCP</text>
<text x="572" y="141.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">192.168.1.1 · internet optional</text>
<text x="572" y="157.5" font-size="12" text-anchor="start" font-weight="400" fill="#57606a">(website sync, updates)</text>
<rect x="430" y="220" width="540" height="70" rx="8" fill="#ddf4ff" stroke="#57606a" stroke-width="1.5"/>
<text x="442" y="242" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">Core switch  (gigabit, 16+ ports, in the tech rack)</text>
<text x="442" y="271.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">all wired gear; reserve the server&#x27;s address in DHCP or set it fixed</text>
<polyline points="700,160 700,220" fill="none" stroke="#1f6feb" stroke-width="2.2" stroke-linejoin="round"/>
<text x="726" y="196" font-size="11" text-anchor="middle" font-weight="600" fill="#1f6feb" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Cat6</text>
<rect x="40" y="380" width="270" height="110" rx="8" fill="#ddf4ff" stroke="#57606a" stroke-width="1.5"/>
<text x="52" y="402" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">Server (control + overview)</text>
<text x="52" y="431.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">192.168.1.10 (fixed) · control server,</text>
<text x="52" y="447.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">broker, database, MediaMTX,</text>
<text x="52" y="463.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">Godot master, overview screen, sound</text>
<rect x="340" y="380" width="270" height="110" rx="8" fill="#fbefff" stroke="#57606a" stroke-width="1.5"/>
<text x="352" y="402" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">Screen Pis 1–3  (inside the robot)</text>
<text x="352" y="431.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">Raspberry Pi 5 · DHCP · wired</text>
<text x="352" y="447.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">floor screens 1–5, 2 per Pi</text>
<text x="352" y="463.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">on the floor switch (also in the robot)</text>
<rect x="640" y="380" width="250" height="110" rx="8" fill="#fff1e5" stroke="#57606a" stroke-width="1.5"/>
<text x="652" y="402" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">Lighting bridge</text>
<text x="652" y="431.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">DHCP · MQTT client of</text>
<text x="652" y="447.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">the broker → DMX / Art-Net</text>
<text x="652" y="463.5" font-size="12" text-anchor="start" font-weight="400" fill="#57606a">(e.g. a Pi + USB-DMX)</text>
<polyline points="175,380 175,355 480,355 480,290" fill="none" stroke="#1f6feb" stroke-width="2.2" stroke-linejoin="round"/>
<polyline points="765,380 765,355 720,355 720,290" fill="none" stroke="#1f6feb" stroke-width="2.2" stroke-linejoin="round"/>
<polyline points="460,490 460,560" fill="none" stroke="#1f6feb" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="472,490 472,560" fill="none" stroke="#1f6feb" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="484,490 484,560" fill="none" stroke="#1f6feb" stroke-width="1.6" stroke-linejoin="round"/>
<text x="183" y="372" font-size="11" text-anchor="start" font-weight="700" fill="#1f6feb" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Cat6</text>
<text x="505" y="530" font-size="11" text-anchor="start" font-weight="700" fill="#1f6feb" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3 × Cat6</text>
<rect x="1030" y="220" width="330" height="70" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
<text x="1042" y="242" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">Wifi access point  “cybercircle”</text>
<text x="1042" y="271.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">WPA2, same subnet (bridged, no NAT / client isolation)</text>
<polyline points="970,255 1030,255" fill="none" stroke="#1f6feb" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="1030" y="380" width="330" height="110" rx="8" fill="#fff8c5" stroke="#57606a" stroke-width="1.5"/>
<text x="1042" y="402" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">Phones &amp; tablets</text>
<text x="1042" y="431.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">gamemaster app → http(s)://192.168.1.10</text>
<text x="1042" y="447.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">players&#x27; accessible page + video</text>
<text x="1042" y="463.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">operator laptop (web interface)</text>
<polyline points="1195,290 1195,380" fill="none" stroke="#1f6feb" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 5"/>
<polygon points="1195.0,380.0 1190.9,370.9 1199.1,370.9" fill="#1f6feb"/>
<polygon points="1195.0,290.0 1199.1,299.1 1190.9,299.1" fill="#1f6feb"/>
<text x="1220" y="340" font-size="11" text-anchor="middle" font-weight="600" fill="#1f6feb" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">wifi</text>
<rect x="430" y="560" width="540" height="70" rx="8" fill="#dafbe1" stroke="#57606a" stroke-width="1.5"/>
<text x="442" y="582" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">Floor switch  (24 ports, inside the robot)</text>
<text x="442" y="611.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">13 tiles + robot + Pi 1–3 · one Cat6 uplink to the core switch · PoE: ESP32-POE only</text>
<rect x="100" y="560" width="290" height="70" rx="8" fill="#dafbe1" stroke="#57606a" stroke-width="1.5"/>
<text x="112" y="582" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">The robot  (its ESP32, in the robot)</text>
<text x="112" y="610.5" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">WT32-ETH01 · DHCP · wired · MQTT robot/…</text>
<text x="112" y="625.5" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">flashed over Ethernet (OTA) after the first time</text>
