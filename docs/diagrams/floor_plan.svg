<text x="992" y="120" font-size="12" text-anchor="start" font-weight="700" fill="#24292f">In each duct</text>
<polyline points="994,136 1040,136" fill="none" stroke="#1f6feb" stroke-width="2.2" stroke-linejoin="round"/>
<text x="1052" y="140" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">Cat6 to the floor switch</text>
