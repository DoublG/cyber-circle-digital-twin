<text x="1052" y="160" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">24 V feed (2 × 1.5 mm²)</text>
<polyline points="994,176 1040,176" fill="none" stroke="#8250df" stroke-width="2.2" stroke-linejoin="round"/>
<text x="1052" y="180" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">screen on the wall</text>
<rect x="980" y="220" width="390" height="318.5" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="992" y="240" font-size="12.5" text-anchor="start" font-weight="700" fill="#24292f">Cable runs</text>
<text x="992" y="262" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">Inside the robot: screen Pi 1–3, the floor switch, the</text>
<text x="992" y="278.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">24 V / 10 A PSU with a fuse per tile, one Cat6 uplink</text>
<text x="992" y="295.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">and the mains to the tech rack. HDMI from the Pis to</text>
<text x="992" y="311.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">screens 1–5: active / optical HDMI beyond 3–5 m.</text>
<text x="992" y="328.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f"></text>
<text x="992" y="344.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">Each duct: Cat6 + 24 V (2-core) side by side; leave</text>
<text x="992" y="361.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">a pull cord in. Label both ends with the place (T01…).</text>
<text x="992" y="377.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f"></text>
<text x="992" y="394.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">A tile&#x27;s place is set in the web interface (device ↔</text>
<text x="992" y="410.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">place), not by which port it is on: swapping a tile</text>
<text x="992" y="427.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">= plug in a spare, assign it to the place.</text>
<text x="992" y="443.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f"></text>
<text x="992" y="460.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">Screens (positions here only an example): where the</text>
<text x="992" y="476.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">players at those tiles can see them, clear of the robot.</text>
<text x="992" y="493.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">Which tiles a screen shows: GAME_SCREENS (§4).</text>
<text x="992" y="509.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">The game&#x27;s own model draws the ducts it sees</text>
<text x="992" y="526.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">configured (partial installations hide the rest).</text>
<rect x="980" y="600" width="390" height="150" rx="8" fill="#dafbe1" stroke="#57606a" stroke-width="1.5"/>
<text x="992" y="622" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">Mobile station  (M1–M5)</text>
<text x="992" y="651.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">a table at the wall with up to 5 hand-held tiles</text>
<text x="992" y="667.5" font-size="12" text-anchor="start" font-weight="400" fill="#57606a">(wheelchair users, blind players, a tablet):</text>
<text x="992" y="683.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">Cat6 + 5 V from a small switch / PSU at the</text>
<text x="992" y="699.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">station, or wifi; their screens Mobile A / B on</text>
<text x="992" y="715.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">Pi 4, which stands at the station.</text>
<text x="992" y="731.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">Accessible page: the player&#x27;s own phone.</text>
