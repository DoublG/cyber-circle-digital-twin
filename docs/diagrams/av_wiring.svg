<text x="52" y="167.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">sound card: only the fallback (no Pis,</text>
<text x="52" y="183.5" font-size="12" text-anchor="start" font-weight="400" fill="#24292f">or Geluid op = master / beide)</text>
