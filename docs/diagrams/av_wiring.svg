<text x="24" y="38" font-size="24" text-anchor="start" font-weight="700" fill="#24292f">Screens, sound and lights – wiring</text>
<text x="24" y="62" font-size="13" text-anchor="start" font-weight="400" fill="#57606a">The server drives the overview; 4 Raspberry Pi 5 drive the 7 split screens and play the sound (Pi 4 at the mobile station); DMX via your lighting system</text>
