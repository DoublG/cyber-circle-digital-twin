<text x="675" y="565" font-size="11" text-anchor="middle" font-weight="600" fill="#8250df">micro-HDMI → HDMI: passive ≤ 3–5 m; from the robot to a wall screen further away: active / optical HDMI</text>
<text x="675" y="581" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">monitor: scaling 1:1 (the SETUP test pattern shows it), sleep off · which tiles a screen shows: GAME_SCREENS</text>
<rect x="870" y="100" width="490" height="70" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
<text x="882" y="122" font-size="15" text-anchor="start" font-weight="700" fill="#24292f">Server sound card  –  the fallback</text>
<text x="882" y="150.5" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">no Pis connected, or Geluid op = master / beide: 5.1, front L/R = the</text>
<text x="882" y="165.5" font-size="11" text-anchor="start" font-weight="400" fill="#24292f">effects, centre = the voice (its own jack: a speaker or headphones)</text>
<polyline points="345,100 345,88 845,88 845,135 870,135" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="5 4"/>
