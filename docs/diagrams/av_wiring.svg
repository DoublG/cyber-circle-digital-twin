<text x="853" y="82" font-size="10.5" text-anchor="start" font-weight="700" fill="#1a7f37">fallback</text>
<rect x="870" y="195" width="490" height="170.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="882" y="215" font-size="12.5" text-anchor="start" font-weight="700" fill="#24292f">Sound – on the Pis (default)</text>
<text x="882" y="237" font-size="11.5" text-anchor="start" font-weight="700" fill="#24292f">Each Pi plays the sound itself, on its 3.5 mm jack or HDMI:</text>
<text x="882" y="253.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">every sound effect (the master picks the file, all play the same)</text>
<text x="882" y="270.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">+ the read-aloud lines of its own screens (a question on every Pi,</text>
<text x="882" y="286.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">an invite only on the Pi with that tile&#x27;s screen).</text>
<text x="882" y="303.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">Pi 1–3 (in the robot): active speakers on the jack, or the monitors&#x27;</text>
<text x="882" y="319.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">own speakers over HDMI. Pi 4: a speaker / headphones at the station.</text>
<text x="882" y="336.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">Instellingen › Geluid: automatisch = on the Pis when any are connected.</text>
<text x="882" y="352.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">Voorlezen (the narrator) has its own on / off – off by default.</text>
<rect x="20" y="650" width="1360" height="250" rx="14" fill="#fff1e5" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="34" y="670" font-size="13" text-anchor="start" font-weight="700" fill="#57606a">LIGHTS  (your lighting system – the game only sends MQTT)</text>
