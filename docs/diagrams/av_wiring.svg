<rect x="1360" y="723" width="14" height="24" rx="2" fill="#d4730b" stroke="#24292f" stroke-width="1.5"/>
<polyline points="1360,735 1360,735" fill="none" stroke="#d4730b" stroke-width="2.2" stroke-linejoin="round"/>
<text x="1366" y="790" font-size="10.5" text-anchor="end" font-weight="700" fill="#d4730b">120 Ω terminator</text>
<text x="40" y="820" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">DMX512: one daisy chain (bus), 120 Ω DMX cable (not microphone cable), XLR 3- or 5-pin, max 32 fixtures and ~300 m</text>
<text x="40" y="838" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">per chain, a 120 Ω terminator in the last fixture&#x27;s DMX out. More fixtures / long runs: a DMX splitter (opto-isolated).</text>
<text x="40" y="860" font-size="11.5" text-anchor="start" font-weight="400" fill="#24292f">Map fixtures by tile number or by angle (T01 = 0°, clockwise ≈ 27.7° per tile) – the events carry both.  Flashes: at most 3 per second, none when flashes = false.</text>
<text x="40" y="880" font-size="11.5" text-anchor="start" font-weight="400" fill="#57606a">The robot&#x27;s own lights and smoke are not DMX: its ESP32 runs them (robot/cmd, robot_wiring.svg).</text>
